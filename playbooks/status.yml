---
- name: Keycloak node status
  hosts: keycloak
  become: true
  gather_facts: false
  tasks:
    - name: Read the compose status
      ansible.builtin.command:
        argv: [docker, compose, ps, --format, json]
        chdir: "{{ keycloak_compose_dir | default('/opt/keycloak') }}"
      register: keycloak_container
      changed_when: false
      failed_when: false

    - name: Read the readiness probe
      ansible.builtin.uri:
        url: "{{ keycloak_management_scheme }}://127.0.0.1:{{ keycloak_management_port }}/health/ready"
        validate_certs: false
        status_code: [200, 503]
      register: keycloak_ready
      failed_when: false

    - name: Read the load balancer probe
      ansible.builtin.uri:
        url: http://127.0.0.1/lb-check
        status_code: [200, 502, 503]
      register: keycloak_lb
      failed_when: false

    - name: Show the node status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} {{ keycloak_role }}
          {{ keycloak_container.stdout | default('compose=down') }}
          health={{ keycloak_ready.status | default('down') }}
          lb-check={{ keycloak_lb.status | default('down') }}
