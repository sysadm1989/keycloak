---
- name: Prepare hosts
  hosts: all
  become: true
  roles:
    - common

- name: Install Keycloak
  hosts: keycloak
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - keycloak

- name: Restrict network access
  hosts: all
  become: true
  roles:
    - firewall

- name: Ban abusive clients from nginx logs
  hosts: keycloak
  become: true
  roles:
    - fail2ban
