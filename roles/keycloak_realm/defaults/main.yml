---
# Совпадает с ролью keycloak / nginx (defaults роли keycloak здесь недоступны).
keycloak_http_port: 8080
keycloak_admin_username: admin

# Каталог YAML реалмов (относительно inventory: ../../realms).
keycloak_realm_dir: "{{ inventory_dir | dirname | dirname }}/realms"

# LDAP/AD/FreeIPA на реалмы. Пустой список — федерацию не трогаем.
# Каждый элемент: realm + vendor (ad|rhds|other) + connection_url, users_dn,
# groups_dn, bind_dn, bind_password. Опционально: name (имя провайдера в KC).
#
# keycloak_ldap_federations:
#   - realm: platforms
#     name: ad
#     vendor: ad
#     connection_url: "ldap://office.corp:389"
#     users_dn: "CN=Users,DC=office,DC=corp"
#     groups_dn: "OU=platforms,DC=office,DC=corp"
#     bind_dn: "CN=svc_keycloak,CN=Users,DC=office,DC=corp"
#     bind_password: "{{ vault_keycloak_ldap_ad_bind_password }}"
#   - realm: apps
#     name: ad
#     vendor: ad
#     connection_url: "ldap://office.corp:389"
#     users_dn: "CN=Users,DC=office,DC=corp"
#     groups_dn: "CN=Users,DC=office,DC=corp"
#     bind_dn: "CN=svc_keycloak,CN=Users,DC=office,DC=corp"
#     bind_password: "{{ vault_keycloak_ldap_ad_bind_password }}"
keycloak_ldap_federations: []

# Дефолты атрибутов, если в элементе federations не заданы явно.
keycloak_ldap_edit_mode: READ_ONLY
keycloak_ldap_group_name_attribute: cn
keycloak_ldap_membership_attribute: member

# Импортировать users из YAML реалма.
keycloak_realm_import_users: false
# Обновлять существующий реалм.
keycloak_realm_reconcile: true
# При reconcile обновлять и настройки реалма (не только клиентов и т.п.).
keycloak_realm_reconcile_settings: true
# Реалмы к удалению.
keycloak_realms_absent: []
# Какие ключи настроек реалма переносить при PUT.
keycloak_realm_setting_keys:
  - realm
  - enabled
  - displayName
  - displayNameHtml
  - sslRequired
  - registrationAllowed
  - registrationEmailAsUsername
  - rememberMe
  - verifyEmail
  - loginWithEmailAllowed
  - duplicateEmailsAllowed
  - resetPasswordAllowed
  - editUsernameAllowed
  - bruteForceProtected
  - permanentLockout
  - failureFactor
  - accessTokenLifespan
  - ssoSessionIdleTimeout
  - ssoSessionMaxLifespan
  - ssoSessionIdleTimeoutRememberMe
  - ssoSessionMaxLifespanRememberMe
  - revokeRefreshToken
  - refreshTokenMaxReuse
  - offlineSessionIdleTimeout
  - offlineSessionMaxLifespan
  - offlineSessionMaxLifespanEnabled
  - loginTheme
  - accountTheme
  - emailTheme
  - internationalizationEnabled
  - supportedLocales
  - defaultLocale
  - passwordPolicy
  - attributes
# Что вырезать из тела перед PUT реалма (импортируется отдельно / не трогаем).
keycloak_realm_put_deny:
  - users
  - federatedUsers
  - clients
  - roles
  - groups
  - identityProviders
  - identityProviderMappers
  - components
  - authenticationFlows
  - authenticatorConfig
  - requiredActions
  - clientScopes
  - defaultDefaultClientScopes
  - defaultOptionalClientScopes
  - clientScopeMappings
  - scopeMappings
  - applications
  - oauthClients
  - clientProfiles
  - clientPolicies
