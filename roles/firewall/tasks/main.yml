---
- name: Skip firewall management
  ansible.builtin.meta: end_host
  when: not (firewall_enabled | bool)

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Disable ufw (conflicts with Docker / nftables)
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
  failed_when: false

- name: Force-disable ufw if present
  ansible.builtin.command: ufw --force disable
  register: firewall_ufw_disable
  changed_when: "'Firewall stopped' in firewall_ufw_disable.stdout or 'disabled' in (firewall_ufw_disable.stdout | lower)"
  failed_when: false

- name: Create nftables.d
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install nftables.conf
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Install Keycloak firewall rules
  ansible.builtin.template:
    src: keycloak.nft.j2
    dest: /etc/nftables.d/keycloak.nft
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true

- name: Apply firewall rules now
  ansible.builtin.meta: flush_handlers
