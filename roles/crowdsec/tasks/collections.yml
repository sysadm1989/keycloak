---
- name: Install CrowdSec Hub collections
  ansible.builtin.command:
    argv:
      - cscli
      - collections
      - install
      - "{{ item }}"
  loop: "{{ crowdsec_collections }}"
  register: crowdsec_collection_install
  changed_when: >-
    'successfully installed' in (crowdsec_collection_install.stdout | default('') | lower)
    or 'downloaded' in (crowdsec_collection_install.stdout | default('') | lower)
  failed_when: >-
    crowdsec_collection_install.rc != 0
    and 'already exist' not in (crowdsec_collection_install.stderr | default('') | lower)
    and 'already installed' not in (crowdsec_collection_install.stdout | default('') | lower)
  notify: Restart CrowdSec
