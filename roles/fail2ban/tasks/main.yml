---
- name: Skip fail2ban
  ansible.builtin.meta: end_host
  when: not (fail2ban_enabled | bool)

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

- name: Install nginx-keycloak filter
  ansible.builtin.template:
    src: nginx-keycloak.conf.j2
    dest: /etc/fail2ban/filter.d/nginx-keycloak.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Install jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
