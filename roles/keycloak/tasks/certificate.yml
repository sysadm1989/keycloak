---
- name: Require an email for Let's Encrypt
  ansible.builtin.assert:
    that: keycloak_acme_email | length > 0
    fail_msg: "Для внешнего Keycloak задайте keycloak_acme_email. Активный узел выпустит сертификат и скопирует его на пассивный."

- name: Remember the passive node
  ansible.builtin.set_fact:
    keycloak_passive_host: "{{ groups['keycloak'][1] }}"
    keycloak_passive_address: "{{ hostvars[groups['keycloak'][1]].keycloak_address }}"
    keycloak_passive_user: "{{ hostvars[groups['keycloak'][1]].ansible_user }}"
  when: groups['keycloak'] | length > 1

- name: Install software-properties-common
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    update_cache: true

- name: Read apt components
  ansible.builtin.command:
    argv:
      - grep
      - -RIs
      - ^Components:
      - /etc/apt/sources.list.d
      - /etc/apt/sources.list
  register: apt_components
  changed_when: false
  failed_when: false

- name: Enable the universe repository
  ansible.builtin.command: add-apt-repository -y universe
  when: "'universe' not in (apt_components.stdout | default(''))"

- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present
    update_cache: true

- name: Ensure the Let's Encrypt directory
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0755"

# include_tasks: иначе Ansible шаблонит delegate_to до when и падает на одном узле.
- name: Prepare certificate sync to the passive node
  ansible.builtin.include_tasks: certificate_passive_prepare.yml
  when: groups['keycloak'] | length > 1

- name: Install the deploy hook
  ansible.builtin.template:
    src: keycloak-cert-deploy.sh.j2
    dest: /usr/local/sbin/keycloak-cert-deploy
    owner: root
    group: root
    mode: "0755"

- name: Install the ACME auth hook
  ansible.builtin.template:
    src: acme-auth.sh.j2
    dest: /usr/local/sbin/acme-auth
    owner: root
    group: root
    mode: "0755"

- name: Install the ACME cleanup hook
  ansible.builtin.template:
    src: acme-cleanup.sh.j2
    dest: /usr/local/sbin/acme-cleanup
    owner: root
    group: root
    mode: "0755"

- name: Issue the Let's Encrypt certificate on the active node
  ansible.builtin.command:
    argv: "{{ ['certbot', 'certonly', '--non-interactive', '--agree-tos', '--email', keycloak_acme_email, '--domain', keycloak_hostname, '--manual', '--preferred-challenges', 'http', '--manual-auth-hook', '/usr/local/sbin/acme-auth', '--manual-cleanup-hook', '/usr/local/sbin/acme-cleanup', '--deploy-hook', '/usr/local/sbin/keycloak-cert-deploy', '--keep-until-expiring'] + (['--test-cert'] if (keycloak_acme_staging | bool) else []) }}"
  register: acme_issue
  changed_when: "'not yet due for renewal' not in (acme_issue.stdout | lower)"

- name: Stop the packaged certbot timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Renew the certificate on the active node
  ansible.builtin.cron:
    name: certbot-renew
    minute: "15"
    hour: "3"
    user: root
    job: certbot renew --quiet

- name: Read the issued certificate
  ansible.builtin.slurp:
    src: "/etc/letsencrypt/live/{{ keycloak_hostname }}/fullchain.pem"
  register: keycloak_issued_crt

- name: Read the issued private key
  ansible.builtin.slurp:
    src: "/etc/letsencrypt/live/{{ keycloak_hostname }}/privkey.pem"
  register: keycloak_issued_key

- name: Sync the certificate to the passive node
  ansible.builtin.include_tasks: certificate_passive_sync.yml
  when: groups['keycloak'] | length > 1

- name: Wait until the active node is ready
  ansible.builtin.uri:
    url: "{{ keycloak_management_scheme }}://127.0.0.1:{{ keycloak_management_port }}/health/ready"
    validate_certs: false
    status_code: 200
  register: keycloak_ready
  until: keycloak_ready.status == 200
  retries: 36
  delay: 5
