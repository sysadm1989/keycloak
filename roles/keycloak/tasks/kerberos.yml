---
- name: Require Kerberos sources
  ansible.builtin.assert:
    that:
      - keycloak_kerberos_keytab_src | length > 0
      - (keycloak_kerberos_krb5_src | length > 0)
        or (
          (keycloak_kerberos_default_realm | length > 0)
          and (keycloak_kerberos_realms | length > 0)
        )
    fail_msg: >-
      Для Kerberos задайте keycloak_kerberos_keytab_src и либо
      keycloak_kerberos_krb5_src, либо keycloak_kerberos_default_realm
      с keycloak_kerberos_realms.

- name: Install Kerberos keytab
  ansible.builtin.copy:
    src: "{{ keycloak_kerberos_keytab_src }}"
    dest: "{{ keycloak_compose_dir }}/keytabs/{{ keycloak_kerberos_keytab_name }}"
    owner: "1000"
    group: "0"
    mode: "0440"
  register: keycloak_kerberos_keytab

- name: Install krb5.conf from file
  ansible.builtin.copy:
    src: "{{ keycloak_kerberos_krb5_src }}"
    dest: "{{ keycloak_compose_dir }}/krb5.conf"
    owner: "1000"
    group: "0"
    mode: "0444"
  register: keycloak_kerberos_krb5_copy
  when: keycloak_kerberos_krb5_src | length > 0

- name: Install krb5.conf from realms
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: "{{ keycloak_compose_dir }}/krb5.conf"
    owner: "1000"
    group: "0"
    mode: "0444"
  register: keycloak_kerberos_krb5_template
  when: keycloak_kerberos_krb5_src | length == 0

- name: Remember Kerberos changes
  ansible.builtin.set_fact:
    keycloak_kerberos_changed: >-
      {{
        (keycloak_kerberos_keytab is changed)
        or (keycloak_kerberos_krb5_copy is defined and keycloak_kerberos_krb5_copy is changed)
        or (keycloak_kerberos_krb5_template is defined and keycloak_kerberos_krb5_template is changed)
      }}
