---
# Образ Keycloak.
keycloak_version: "26.8.1"
keycloak_image: "sysadm1989/keycloak:{{ keycloak_version }}"

# Публичное DNS-имя SSO (A-запись на белый IP). Issuer OIDC.
keycloak_hostname: sso.nemero.online
# Let's Encrypt на hostname.
keycloak_external: true
keycloak_acme_email: sso@nemero.online

# Bootstrap admin (пароль в ansible-vault).
keycloak_admin_username: admin
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"

# PostgreSQL (создаёт другая система).
keycloak_db_name: keycloak
keycloak_db_user: dbuser_keycloak
keycloak_db_password: "{{ vault_keycloak_db_password }}"
keycloak_db_port: 5433
keycloak_db_hosts:
  - 10.129.32.120

# CrowdSec: логи nginx Keycloak (whitelist 10/8 — в defaults роли).
crowdsec_log_sources:
  - filenames:
      - /var/log/nginx/keycloak-access.log
      - /var/log/nginx/keycloak-error.log
    labels:
      type: nginx

# LDAP на реалмы: vendor ad | rhds (FreeIPA) | other. Пароли — в vault.
# FreeIPA (если понадобится): ldaps://FQDN:636 — hostname из SAN, не IP;
# CA: files/keycloak/truststores/freeipa-ca.crt ← /etc/ipa/ca.crt
keycloak_truststores_src: "{{ inventory_dir | dirname | dirname }}/files/keycloak/truststores"
keycloak_ldap_federations:
  - realm: platforms
    name: ad
    vendor: ad
    connection_url: "ldaps://office.corp:636"
    users_dn: "OU=Users,OU=Office,DC=office,DC=corp"
    groups_dn: "OU=Platforms,OU=Groups,OU=Office,DC=office,DC=corp"
    bind_dn: "CN=svc_keycloak_binddn,OU=Service_Users,OU=Office,DC=office,DC=corp"
    bind_password: "{{ vault_keycloak_ldap_ad_bind_password }}"
  - realm: atlassian
    name: ad
    vendor: ad
    connection_url: "ldaps://office.corp:636"
    users_dn: "OU=Users,OU=Office,DC=office,DC=corp"
    groups_dn: "OU=Atlassian,OU=Groups,OU=Office,DC=office,DC=corp"
    bind_dn: "CN=svc_keycloak_binddn,OU=Service_Users,OU=Office,DC=office,DC=corp"
    bind_password: "{{ vault_keycloak_ldap_ad_bind_password }}"

# Опционально позже:
# keycloak_kerberos_enabled: true
# firewall_ssh_cidrs: ["10.0.0.0/8"]   # по умолчанию в роли — 0.0.0.0/0
