---
# Три ЦОД для PostgreSQL. Keycloak — два узла: активный, затем пассивный.
# HAProxy стоит на этих же узлах. Порядок в группе keycloak важен:
# minor-обновление идёт сначала по активному.
all:
  vars:
    ansible_user: deploy
    deploy_database: true
  children:
    dc1:
      vars:
        keycloak_site: dc1
      children:
        keycloak_dc1:
          hosts:
            kc-dc1:
              ansible_host: 10.11.1.11
              keycloak_role: active
        postgres_dc1:
          hosts:
            pg-dc1:
              ansible_host: 10.11.1.20
              patroni_node_name: pg-dc1
    dc2:
      vars:
        keycloak_site: dc2
      children:
        keycloak_dc2:
          hosts:
            kc-dc2:
              ansible_host: 10.12.1.11
              keycloak_role: passive
        postgres_dc2:
          hosts:
            pg-dc2:
              ansible_host: 10.12.1.20
              patroni_node_name: pg-dc2
    dc3:
      vars:
        keycloak_site: dc3
      children:
        postgres_dc3:
          hosts:
            pg-dc3:
              ansible_host: 10.13.1.20
              patroni_node_name: pg-dc3

    keycloak:
      children:
        keycloak_dc1:
        keycloak_dc2:
    haproxy:
      children:
        keycloak:
    postgres:
      children:
        postgres_dc1:
        postgres_dc2:
        postgres_dc3:
    # Имя клиентов отдаёт PowerDNS. Группу оставьте пустой.
    gslb:
      hosts: {}
    unused:
      hosts: {}
