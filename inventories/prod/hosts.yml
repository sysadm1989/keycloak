# Узлы Keycloak в одном кластере. Сейчас один узел с белым IP (DNS A → ansible_host).
# Порядок в группе keycloak важен: update и Let's Encrypt — сначала active.
# keycloak_role: active — выпускает LE; passive — получает копию сертификата.
# keycloak_site — метка площадки для Infinispan (разные ЦОД).
# Второй ЦОД: docs/2-cod.md
#
# ansible_host     — белый IP / куда Ansible ходит по SSH (и куда смотрит DNS SSO).
# keycloak_address — внутренний IP: JGroups, nftables (7800/57800), копия LE active→passive.
# Могут различаться (SSH/DNS снаружи, кластер по приватной сети), как у kc-dc1.
all:
  vars:
    # SSH-пользователь на узлах.
    ansible_user: ubuntu
  children:
    dc1:
      vars:
        keycloak_site: dc1
      children:
        keycloak_dc1:
          hosts:
            kc-dc1:
              # SSH с управляющей машины (например публичный IP).
              ansible_host: 109.233.109.165
              # Приватный IP для JGroups / firewall / копии сертификата.
              keycloak_address: 10.129.32.99
              keycloak_role: active
    dc2:
      vars:
        keycloak_site: dc2
      children:
        keycloak_dc2:
          hosts:
            kc-dc2:
              # Здесь SSH и кластерный адрес совпадают.
              ansible_host: 10.130.33.26
              keycloak_address: 10.130.33.26
              keycloak_role: passive

    keycloak:
      children:
        keycloak_dc1:
        #keycloak_dc2:
