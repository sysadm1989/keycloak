# Два узла Keycloak в одном кластере; NLB шлёт трафик на оба (active-active по трафику).
# Порядок в группе keycloak важен: update и Let's Encrypt — сначала active.
# ansible_host и keycloak_address — один и тот же адрес узла (SSH, JGroups, nftables, копия сертификата).
# keycloak_role: active — выпускает LE; passive — получает копию сертификата.
# keycloak_site — метка площадки для Infinispan (разные ЦОД).
# A-запись SSO указывает на NLB; плейбук балансировщик не создаёт.
all:
  vars:
    # SSH-пользователь на узлах.
    ansible_user: nazarov
  children:
    dc1:
      vars:
        keycloak_site: dc1
      children:
        keycloak_dc1:
          hosts:
            kc-dc1:
              ansible_host: 10.129.33.23
              keycloak_address: 10.129.33.23
              keycloak_role: active
    dc2:
      vars:
        keycloak_site: dc2
      children:
        keycloak_dc2:
          hosts:
            kc-dc2:
              ansible_host: 10.130.33.26
              keycloak_address: 10.130.33.26
              keycloak_role: passive

    keycloak:
      children:
        keycloak_dc1:
        keycloak_dc2:
